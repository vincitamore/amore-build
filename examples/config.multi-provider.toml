# Arcus Build — multi-provider example config
# Copy fields you need into ~/.arcus/config.toml (or $GROK_HOME/config.toml).
#
# Product posture: the shipped default is GLM-5.2 over OpenRouter, but the
# harness is not a wrapper around any one model. Native grok is the second
# rail (login / XAI_API_KEY). Baked catalog grok-4.5 is technical fallback
# only — not the default.
#
# EVERY custom [model.*] MUST set system_prompt_label. Unlabeled models
# resolve to the product default identity and play the wrong persona in tool
# loops. The label names the harness and the role, never the model or its
# lab — see docs/setup-glm.md for the full identity-rule doctrine and why
# every block below uses "Arcus Build" regardless of which model it points
# at.
#
# Prefer env_key over literal api_key. Each env_key comment names the process
# environment variable that must be set before `arcus` runs.
#
# Pricing / availability notes in docs/setup-glm.md are as of 2026-07-31;
# re-verify before relying on them.
#
# Schema: [model.<id>] → ConfigModelOverride
#   crates/codegen/xai-grok-shell/src/agent/config.rs (ConfigModelOverride)
# Shared blocks: [model_providers.<id>] → ModelProviderConfig
#   crates/codegen/xai-grok-shell/src/agent/model_providers.rs

# ---------------------------------------------------------------------------
# Default: pick ONE headline path after you set the matching env var.
# ---------------------------------------------------------------------------
[models]
default = "glm-openrouter"
# default = "glm-zai"
# default = "openweight"
# default = "grok-4.5"   # technical fallback / freight only — not marketed default

# ---------------------------------------------------------------------------
# Shared OpenRouter connection defaults (optional DRY for multiple OR models)
# env: OPENROUTER_API_KEY
# ---------------------------------------------------------------------------
[model_providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
# Optional OpenRouter ranking headers (static; no secrets):
# extra_headers = { "HTTP-Referer" = "https://example.com", "X-Title" = "Arcus Build" }

# ---------------------------------------------------------------------------
# (1) GLM-5.2 via OpenRouter — preferred on-ramp
# Wire model id: z-ai/glm-5.2
# env: OPENROUTER_API_KEY  (https://openrouter.ai/keys)
# Probe: arcus -m glm-openrouter -p "Reply with exactly: ARCUS-OR-OK"
# ---------------------------------------------------------------------------
[model.glm-openrouter]
model = "z-ai/glm-5.2"
model_provider = "openrouter"
name = "GLM-5.2 (OpenRouter)"
system_prompt_label = "Arcus Build"
context_window = 1048576
# Reasoning tokens count against this cap. OpenRouter reports a provider
# ceiling of 128000; 32768 leaves headroom without truncating mid-thought.
max_completion_tokens = 32768
# api_backend defaults to "chat_completions" — correct for OpenRouter

# ---------------------------------------------------------------------------
# (2) GLM-5.2 via Z.ai direct — the model's own API surface
# Wire model id: glm-5.2
# env: ZAI_API_KEY  (https://z.ai/manage-apikey/apikey-list)
# Probe: arcus -m glm-zai -p "Reply with exactly: ARCUS-ZAI-OK"
# ---------------------------------------------------------------------------
[model.glm-zai]
model = "glm-5.2"
base_url = "https://api.z.ai/api/paas/v4"
name = "GLM-5.2 (Z.ai)"
env_key = "ZAI_API_KEY"
system_prompt_label = "Arcus Build"
context_window = 1048576
max_completion_tokens = 32768

# ---------------------------------------------------------------------------
# (3) Any other OpenAI-compatible host
# Not OpenRouter, not Z.ai: a hyperscaler endpoint, a dedicated deployment,
# or a different model entirely. "openweight" is a placeholder key name, not
# a reserved identifier — fill in your own wire model id, base URL, and env.
# Probe: arcus -m openweight -p "Reply with exactly: ARCUS-OW-OK"
# ---------------------------------------------------------------------------
[model.openweight]
model = "REPLACE-WITH-THE-HOST-WIRE-MODEL-ID"
base_url = "https://YOUR-HOST/v1"
name = "Open host"
env_key = "YOUR_HOST_API_KEY"
system_prompt_label = "Arcus Build"
context_window = 1048576
max_completion_tokens = 32768

# ---------------------------------------------------------------------------
# Native grok rail — second path (login-covered or XAI_API_KEY)
# Interactive: arcus login  → session in ~/.arcus/auth.json
# Headless:    export XAI_API_KEY=xai-...   (https://console.x.ai)
# Probe: arcus -m grok-4.5 -p "Reply with exactly: GROK-OK"
#
# No base_url / env_key here: first-party catalog entry uses session JWT or
# global XAI_API_KEY. Custom third-party models MUST set their own env_key.
# ---------------------------------------------------------------------------
[model.grok-4.5]
# Override only the label when you want an explicit pin in the picker;
# omit this whole table if the baked catalog entry is enough. Note the
# label is still "Arcus Build", not "Grok 4.5" — the model name already
# lives in `model` / `name`, and the identity rule carves out no exception
# for the native rail.
system_prompt_label = "Arcus Build"
name = "Grok 4.5 (xAI)"

# ---------------------------------------------------------------------------
# Anthropic Messages — WORKAROUND-TIER only (BYOK, not the shipped default)
# ConfigModelOverride has no auth_scheme field; use messages + headers.
# env: ANTHROPIC_API_KEY  (via env_http_headers → x-api-key)
# Probe: arcus -m claude-workaround -p "Reply with exactly: CLAUDE-OK"
# ---------------------------------------------------------------------------
# [model.claude-workaround]
# model = "claude-sonnet-4-6"
# base_url = "https://api.anthropic.com/v1"
# name = "Claude (Messages workaround)"
# api_backend = "messages"
# system_prompt_label = "Arcus Build"
# context_window = 200000
# extra_headers = { "anthropic-version" = "2023-06-01" }
# env_http_headers = { "x-api-key" = "ANTHROPIC_API_KEY" }
