# ConfigModelOverride has no auth_scheme field; use messages + headers.
# env: ANTHROPIC_API_KEY  (via env_http_headers → x-api-key)
# Probe: arcus -m claude-workaround -p "Reply with exactly: CLAUDE-OK"
# ---------------------------------------------------------------------------
