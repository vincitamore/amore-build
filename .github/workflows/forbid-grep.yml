# Public-release gate: fail on tier-1 forbid-list hits.
# Owned by campaign unit U6 (task 1.1). See scripts/forbid_check.py.

name: forbid-grep

on:
  push:
  pull_request:

jobs:
  forbid-list:
    name: forbid-list (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run forbid_check.py (tier-1 fails the job)
        shell: bash
        # Integration policy (campaign wave-1 close): scope to authored surfaces.
        # Upstream crates/ are substring-noise (OMP⊂COMPRESS, ncu⊂concurrent,
        # materia⊂materialize); the whole-tree curated release-gate grep runs at
        # Phase 3. Extend --path docs at Phase 2 when docs/ exists.
        run: |
          python scripts/forbid_check.py --path templates
          python scripts/forbid_check.py --path scripts
          if [ -d docs ]; then python scripts/forbid_check.py --path docs; fi
          if [ -d examples ]; then python scripts/forbid_check.py --path examples; fi
          # Root markdown is an authored surface too (the policy named it; the
          # first cut of this gate did not scan it).
          for f in README.md SECURITY.md CONTRIBUTING.md UPSTREAM.md NOTICE; do
            if [ -f "$f" ]; then python scripts/forbid_check.py --path "$f"; fi
          done
