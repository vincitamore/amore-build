# iris-ci.yml — push/PR lane for instruments/iris (Phase 1.5 D5)
#
# Path-scoped matrix (ubuntu/windows/macos): bun install → test → build-compile
# --with-dash → artifact assert → smoke (--help, regula JSON, daemon health).
# All lanes strict: a dash-build failure on any OS fails the job (D3 deferred
# linux/darwin proof lives here).
#
# Artifact names match build-compile hostOsArch():
#   iris-{windows|darwin|linux}-{x64|arm64}[.exe]
#   iris-dash-{windows|darwin|linux}-{x64|arm64}[.exe]

name: iris-ci

on:
  push:
    paths:
      - "instruments/iris/**"
      - ".github/workflows/iris-ci.yml"
      - ".github/workflows/iris-release-assets.yml"
  pull_request:
    paths:
      - "instruments/iris/**"
      - ".github/workflows/iris-ci.yml"
      - ".github/workflows/iris-release-assets.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: instruments/iris

jobs:
  ci:
    name: iris (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5

      - name: Source hygiene gate (instruments + templates)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            py scripts/check_source_hygiene.py --check
          else
            python3 scripts/check_source_hygiene.py --check
          fi

      - name: Setup Bun 1.3.x
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        timeout-minutes: 5
        with:
          bun-version: "1.3.x"

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-iris-bun-${{ hashFiles('instruments/iris/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-iris-bun-

      - name: bun install (frozen)
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: bun test (0 fail)
        timeout-minutes: 15
        run: bun test

      - name: build-compile --with-dash
        timeout-minutes: 20
        run: bun run scripts/build-compile.ts --with-dash

      - name: Assert artifacts exist
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s 2>/dev/null || echo Windows)" in
            MINGW*|MSYS*|CYGWIN*|Windows*) OS=windows; EXT=.exe ;;
            Darwin*) OS=darwin; EXT= ;;
            Linux*) OS=linux; EXT= ;;
            *)
              # GHA windows often lacks uname in pure bash; fall back via runner.os
              if [ "${{ runner.os }}" = "Windows" ]; then OS=windows; EXT=.exe
              elif [ "${{ runner.os }}" = "macOS" ]; then OS=darwin; EXT=
              else OS=linux; EXT=
              fi
              ;;
          esac
          case "$(uname -m 2>/dev/null || echo x86_64)" in
            x86_64|amd64) ARCH=x64 ;;
            arm64|aarch64) ARCH=arm64 ;;
            *)
              if [ "${{ runner.arch }}" = "ARM64" ]; then ARCH=arm64; else ARCH=x64; fi
              ;;
          esac
          # Windows runners: prefer runner.os over uname (git-bash uname can mislead)
          if [ "${{ runner.os }}" = "Windows" ]; then OS=windows; EXT=.exe; fi
          if [ "${{ runner.os }}" = "macOS" ]; then OS=darwin; EXT=; fi
          if [ "${{ runner.os }}" = "Linux" ]; then OS=linux; EXT=; fi
          BIN="dist/iris-${OS}-${ARCH}${EXT}"
          DASH="dist/iris-dash-${OS}-${ARCH}${EXT}"
          echo "expect multi-tool: $BIN"
          echo "expect dash:       $DASH"
          test -f "$BIN" || { echo "FAIL: missing multi-tool artifact $BIN"; ls -la dist/ || true; exit 1; }
          test -f "$DASH" || { echo "FAIL: missing dash artifact $DASH (linux/darwin dash is D3 deferred proof — must not skip)"; ls -la dist/ || true; exit 1; }
          echo "artifacts ok"

      - name: Smoke (unix) — help, regula JSON, daemon health
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in Darwin*) OS=darwin ;; *) OS=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) ARCH=arm64 ;; *) ARCH=x64 ;; esac
          BIN="dist/iris-${OS}-${ARCH}"
          chmod +x "$BIN" dist/iris-dash-${OS}-${ARCH} || true

          # --help exits 0
          "$BIN" --help
          echo "smoke: --help ok"

          # CI has no GROK_VERSION: assert package.json semver fallback (not 0.0.0)
          "$BIN" --version > /tmp/iris-version.txt
          cat /tmp/iris-version.txt
          test -s /tmp/iris-version.txt || { echo "FAIL: --version empty"; exit 1; }
          grep -Eq '[0-9]+\.[0-9]+\.[0-9]+' /tmp/iris-version.txt \
            || { echo "FAIL: --version missing semver"; exit 1; }
          if grep -qE '(^|[^0-9])0\.0\.0([^0-9]|$)' /tmp/iris-version.txt; then
            echo "FAIL: --version is placeholder 0.0.0"
            exit 1
          fi
          echo "smoke: --version ok ($(cat /tmp/iris-version.txt))"

          # regula JSON surface (capability manifest; no org root required)
          "$BIN" commands --json > /tmp/iris-commands.json
          test -s /tmp/iris-commands.json
          echo "smoke: commands --json ok"

          # Distinct test port (NOT default 3853): 39xx + run salt + OS offset
          OFFSET=1
          [ "$OS" = "darwin" ] && OFFSET=3
          PORT=$((3910 + (${GITHUB_RUN_NUMBER:-0} % 70) + OFFSET))
          echo "smoke: daemon port=$PORT"

          ORG=$(mktemp -d)
          printf '%s\n' '# AGENTS' > "$ORG/AGENTS.md"
          mkdir -p "$ORG/tasks"
          IRIS_HOME=$(mktemp -d)
          export IRIS_HOME
          export IRIS_ORG_ROOT="$ORG"
          export IRIS_PORT="$PORT"
          export IRIS_QMD_NO_REFRESH=1

          "$BIN" daemon --port "$PORT" --no-watch "$ORG" &
          PID=$!
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
            rm -rf "$ORG" "$IRIS_HOME"
          }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/iris-health.json -w "%{http_code}" "http://127.0.0.1:${PORT}/api/health" || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then
            echo "FAIL: daemon health did not return 200 on port $PORT"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          grep -q '"status"' /tmp/iris-health.json || grep -q ok /tmp/iris-health.json
          echo "smoke: health 200 ok ($(cat /tmp/iris-health.json))"

          # Lifecycle: status identity → iris stop → process gone → pidfile removed
          code=$(curl -s -o /tmp/iris-daemon-status.json -w "%{http_code}" "http://127.0.0.1:${PORT}/api/daemon/status" || true)
          if [ "$code" != "200" ]; then
            echo "FAIL: /api/daemon/status http $code"
            exit 1
          fi
          grep -q '"service":"iris-bun-daemon"' /tmp/iris-daemon-status.json \
            || grep -q '"service": "iris-bun-daemon"' /tmp/iris-daemon-status.json
          grep -q '"pid"' /tmp/iris-daemon-status.json
          grep -q '"org_root"' /tmp/iris-daemon-status.json
          echo "smoke: daemon status ok ($(cat /tmp/iris-daemon-status.json))"

          PIDFILE="$IRIS_HOME/iris.pid"
          test -f "$PIDFILE" || { echo "FAIL: missing pidfile $PIDFILE"; ls -la "$IRIS_HOME" || true; exit 1; }
          echo "smoke: pidfile=$(cat "$PIDFILE")"

          "$BIN" stop --json | tee /tmp/iris-stop.json
          grep -q '"ok": *true' /tmp/iris-stop.json
          echo "smoke: iris stop ok"

          for i in $(seq 1 40); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$PID" 2>/dev/null; then
            echo "FAIL: daemon pid $PID still alive after iris stop"
            exit 1
          fi
          wait "$PID" 2>/dev/null || true
          if [ -f "$PIDFILE" ]; then
            echo "FAIL: pidfile still present after stop: $PIDFILE"
            exit 1
          fi
          trap - EXIT
          rm -rf "$ORG" "$IRIS_HOME"
          echo "smoke: daemon lifecycle ok (stop + pidfile cleared)"

      - name: Smoke (windows) — help, regula JSON, daemon health
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $bin = "dist/iris-windows-${arch}.exe"
          if (-not (Test-Path $bin)) { throw "missing multi-tool $bin" }

          # --help exits 0
          & $bin --help
          if ($LASTEXITCODE -ne 0) { throw "--help exit=$LASTEXITCODE" }
          Write-Host "smoke: --help ok"

          # CI has no GROK_VERSION: assert package.json semver fallback (not 0.0.0)
          $verOut = & $bin --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--version exit=$LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($verOut)) { throw "--version produced empty output" }
          if ($verOut -notmatch '\d+\.\d+\.\d+') { throw "--version missing semver: $verOut" }
          if ($verOut -match '(^|[^0-9])0\.0\.0([^0-9]|$)') { throw "--version is placeholder 0.0.0: $verOut" }
          Write-Host "smoke: --version ok ($($verOut.Trim()))"

          # regula JSON surface
          $jsonOut = Join-Path $env:RUNNER_TEMP "iris-commands.json"
          & $bin commands --json | Out-File -FilePath $jsonOut -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "commands --json exit=$LASTEXITCODE" }
          if (-not (Test-Path $jsonOut) -or (Get-Item $jsonOut).Length -lt 2) { throw "commands --json empty" }
          Write-Host "smoke: commands --json ok"

          # Distinct test port (NOT 3853)
          $runN = 0
          if ($env:GITHUB_RUN_NUMBER) { $runN = [int]$env:GITHUB_RUN_NUMBER }
          $port = 3910 + ($runN % 70) + 2
          Write-Host "smoke: daemon port=$port"

          $org = Join-Path $env:RUNNER_TEMP "iris-ci-org-$port"
          New-Item -ItemType Directory -Force -Path (Join-Path $org "tasks") | Out-Null
          Set-Content -Path (Join-Path $org "AGENTS.md") -Value "# AGENTS" -Encoding utf8
          $irisHome = Join-Path $env:RUNNER_TEMP "iris-ci-home-$port"
          New-Item -ItemType Directory -Force -Path $irisHome | Out-Null
          $env:IRIS_HOME = $irisHome
          $env:IRIS_ORG_ROOT = $org
          $env:IRIS_PORT = "$port"
          $env:IRIS_QMD_NO_REFRESH = "1"
          Remove-Item Env:IRIS_URL -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath (Resolve-Path $bin).Path `
            -ArgumentList @("daemon", "--port", "$port", "--no-watch", $org) `
            -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "iris-daemon-out.txt") `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP "iris-daemon-err.txt")

          $healthOk = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:${port}/api/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) {
                  Write-Host "smoke: health 200 ok ($($resp.Content))"
                  $healthOk = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthOk) { throw "daemon health did not return 200 on port $port" }

            # Lifecycle: status identity → iris stop → process gone → pidfile removed
            $statusResp = Invoke-WebRequest -Uri "http://127.0.0.1:${port}/api/daemon/status" -UseBasicParsing -TimeoutSec 2
            if ($statusResp.StatusCode -ne 200) { throw "daemon status http $($statusResp.StatusCode)" }
            $status = $statusResp.Content | ConvertFrom-Json
            if ($status.info.service -ne 'iris-bun-daemon') { throw "bad service $($status.info.service)" }
            if (-not $status.info.pid) { throw "status missing pid" }
            if (-not $status.info.org_root) { throw "status missing org_root" }
            Write-Host "smoke: daemon status ok (pid=$($status.info.pid) org_root=$($status.info.org_root) service=$($status.info.service))"

            $pidfile = Join-Path $irisHome "iris.pid"
            if (-not (Test-Path $pidfile)) { throw "missing pidfile $pidfile" }
            Write-Host "smoke: pidfile=$(Get-Content $pidfile -Raw)"

            $stopJson = & $bin stop --json
            if ($LASTEXITCODE -ne 0) { throw "iris stop exit=$LASTEXITCODE out=$stopJson" }
            Write-Host "smoke: iris stop ok ($stopJson)"

            for ($i = 0; $i -lt 40; $i++) {
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $proc.HasExited) {
              throw "daemon process still alive after iris stop (pid=$($proc.Id))"
            }
            if (Test-Path $pidfile) { throw "pidfile still present after stop: $pidfile" }
            Write-Host "smoke: daemon lifecycle ok (stop + pidfile cleared)"
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              try { $proc.WaitForExit(5000) } catch {}
            }
            if (Test-Path $org) { Remove-Item -Recurse -Force $org -ErrorAction SilentlyContinue }
            if (Test-Path $irisHome) { Remove-Item -Recurse -Force $irisHome -ErrorAction SilentlyContinue }
          }
          Write-Host "smoke: windows lifecycle lane complete"
