# iris-ci.yml — push/PR lane for instruments/iris (Phase 1.5 D5)
#
# Path-scoped matrix (ubuntu/windows/macos): bun install → test → build-compile
# --with-dash → artifact assert → smoke (--help, regula JSON, daemon health).
# All lanes strict: a dash-build failure on any OS fails the job (D3 deferred
# linux/darwin proof lives here).
#
# Artifact names match build-compile hostOsArch():
#   iris-{windows|darwin|linux}-{x64|arm64}[.exe]
#   iris-dash-{windows|darwin|linux}-{x64|arm64}[.exe]

name: iris-ci

on:
  push:
    paths:
      - "instruments/iris/**"
      - ".github/workflows/iris-ci.yml"
      - ".github/workflows/iris-release-assets.yml"
  pull_request:
    paths:
      - "instruments/iris/**"
      - ".github/workflows/iris-ci.yml"
      - ".github/workflows/iris-release-assets.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: instruments/iris

jobs:
  ci:
    name: iris (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Source hygiene gate (instruments + templates)
        working-directory: ..
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            py scripts/check_source_hygiene.py --check
          else
            python3 scripts/check_source_hygiene.py --check
          fi

      - name: Setup Bun 1.3.x
        uses: oven-sh/setup-bun@v2
        timeout-minutes: 5
        with:
          bun-version: "1.3.x"

      - name: Cache bun install
        uses: actions/cache@v4
        timeout-minutes: 5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-iris-bun-${{ hashFiles('instruments/iris/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-iris-bun-

      - name: bun install (frozen)
        timeout-minutes: 10
        run: bun install --frozen-lockfile

      - name: bun test (0 fail)
        timeout-minutes: 15
        run: bun test

      - name: build-compile --with-dash
        timeout-minutes: 20
        run: bun run scripts/build-compile.ts --with-dash

      - name: Assert artifacts exist
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s 2>/dev/null || echo Windows)" in
            MINGW*|MSYS*|CYGWIN*|Windows*) OS=windows; EXT=.exe ;;
            Darwin*) OS=darwin; EXT= ;;
            Linux*) OS=linux; EXT= ;;
            *)
              # GHA windows often lacks uname in pure bash; fall back via runner.os
              if [ "${{ runner.os }}" = "Windows" ]; then OS=windows; EXT=.exe
              elif [ "${{ runner.os }}" = "macOS" ]; then OS=darwin; EXT=
              else OS=linux; EXT=
              fi
              ;;
          esac
          case "$(uname -m 2>/dev/null || echo x86_64)" in
            x86_64|amd64) ARCH=x64 ;;
            arm64|aarch64) ARCH=arm64 ;;
            *)
              if [ "${{ runner.arch }}" = "ARM64" ]; then ARCH=arm64; else ARCH=x64; fi
              ;;
          esac
          # Windows runners: prefer runner.os over uname (git-bash uname can mislead)
          if [ "${{ runner.os }}" = "Windows" ]; then OS=windows; EXT=.exe; fi
          if [ "${{ runner.os }}" = "macOS" ]; then OS=darwin; EXT=; fi
          if [ "${{ runner.os }}" = "Linux" ]; then OS=linux; EXT=; fi
          BIN="dist/iris-${OS}-${ARCH}${EXT}"
          DASH="dist/iris-dash-${OS}-${ARCH}${EXT}"
          echo "expect multi-tool: $BIN"
          echo "expect dash:       $DASH"
          test -f "$BIN" || { echo "FAIL: missing multi-tool artifact $BIN"; ls -la dist/ || true; exit 1; }
          test -f "$DASH" || { echo "FAIL: missing dash artifact $DASH (linux/darwin dash is D3 deferred proof — must not skip)"; ls -la dist/ || true; exit 1; }
          echo "artifacts ok"

      - name: Smoke (unix) — help, regula JSON, daemon health
        if: runner.os != 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in Darwin*) OS=darwin ;; *) OS=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) ARCH=arm64 ;; *) ARCH=x64 ;; esac
          BIN="dist/iris-${OS}-${ARCH}"
          chmod +x "$BIN" dist/iris-dash-${OS}-${ARCH} || true

          # --help exits 0
          "$BIN" --help
          echo "smoke: --help ok"

          # regula JSON surface (capability manifest; no org root required)
          "$BIN" commands --json > /tmp/iris-commands.json
          test -s /tmp/iris-commands.json
          echo "smoke: commands --json ok"

          # Distinct test port (NOT default 3853): 39xx + run salt + OS offset
          OFFSET=1
          [ "$OS" = "darwin" ] && OFFSET=3
          PORT=$((3910 + (${GITHUB_RUN_NUMBER:-0} % 70) + OFFSET))
          echo "smoke: daemon port=$PORT"

          ORG=$(mktemp -d)
          printf '%s\n' '# AGENTS' > "$ORG/AGENTS.md"
          mkdir -p "$ORG/tasks"

          "$BIN" daemon --port "$PORT" --no-watch "$ORG" &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; rm -rf "$ORG"; }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /tmp/iris-health.json -w "%{http_code}" "http://127.0.0.1:${PORT}/api/health" || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then
            echo "FAIL: daemon health did not return 200 on port $PORT"
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          grep -q '"status"' /tmp/iris-health.json || grep -q ok /tmp/iris-health.json
          echo "smoke: health 200 ok ($(cat /tmp/iris-health.json))"

          # Clean shutdown
          kill "$PID"
          wait "$PID" 2>/dev/null || true
          trap - EXIT
          rm -rf "$ORG"
          echo "smoke: daemon shutdown ok"

      - name: Smoke (windows) — help, regula JSON, daemon health
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $bin = "dist/iris-windows-${arch}.exe"
          if (-not (Test-Path $bin)) { throw "missing multi-tool $bin" }

          # --help exits 0
          & $bin --help
          if ($LASTEXITCODE -ne 0) { throw "--help exit=$LASTEXITCODE" }
          Write-Host "smoke: --help ok"

          # regula JSON surface
          $jsonOut = Join-Path $env:RUNNER_TEMP "iris-commands.json"
          & $bin commands --json | Out-File -FilePath $jsonOut -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "commands --json exit=$LASTEXITCODE" }
          if (-not (Test-Path $jsonOut) -or (Get-Item $jsonOut).Length -lt 2) { throw "commands --json empty" }
          Write-Host "smoke: commands --json ok"

          # Distinct test port (NOT 3853)
          $runN = 0
          if ($env:GITHUB_RUN_NUMBER) { $runN = [int]$env:GITHUB_RUN_NUMBER }
          $port = 3910 + ($runN % 70) + 2
          Write-Host "smoke: daemon port=$port"

          $org = Join-Path $env:RUNNER_TEMP "iris-ci-org-$port"
          New-Item -ItemType Directory -Force -Path (Join-Path $org "tasks") | Out-Null
          Set-Content -Path (Join-Path $org "AGENTS.md") -Value "# AGENTS" -Encoding utf8

          $proc = Start-Process -FilePath (Resolve-Path $bin).Path `
            -ArgumentList @("daemon", "--port", "$port", "--no-watch", $org) `
            -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP "iris-daemon-out.txt") `
            -RedirectStandardError (Join-Path $env:RUNNER_TEMP "iris-daemon-err.txt")

          $healthOk = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:${port}/api/health" -UseBasicParsing -TimeoutSec 2
                if ($resp.StatusCode -eq 200) {
                  Write-Host "smoke: health 200 ok ($($resp.Content))"
                  $healthOk = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthOk) { throw "daemon health did not return 200 on port $port" }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              try { $proc.WaitForExit(5000) } catch {}
            }
            if (Test-Path $org) { Remove-Item -Recurse -Force $org -ErrorAction SilentlyContinue }
          }
          Write-Host "smoke: daemon shutdown ok"
