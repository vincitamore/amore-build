name: ci

# Build + test the amore binary surface on Linux and Windows.
# Iris CI has its own lane (iris-ci.yml) scoped to instruments/iris/**.
#
# Build and test are SEPARATE jobs on purpose: one job that produced both a
# release binary and a debug test tree ran the runner out of disk ("No space
# left on device" building rlibs). Split, each profile gets a whole runner —
# and the two run in parallel.

# paths-ignore: skip the 2-platform release-profile build for changes that
# cannot alter the binary. Root "*.md" is deliberate — NOT "**.md": the
# compiled-in changelog (crates/codegen/xai-grok-shell-base/assets/
# amore-changelog.md) and templates/house/** markdown ARE build inputs and
# must keep triggering. docs/** includes the screenshot assets.
on:
  push:
    branches: [main]
    paths-ignore:
      - "instruments/iris/**"
      - "docs/**"
      - "*.md"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "instruments/iris/**"
      - "docs/**"
      - "*.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} — build + smoke
    runs-on: ${{ matrix.os }}
    # A cold release build of this workspace exceeds 60 minutes on a 2-core
    # runner, and a job that times out never saves its cache — so a too-short
    # timeout is self-perpetuating: every run starts cold and dies at the same
    # mark. Generous ceiling; the cache makes real runs far shorter.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          # Authenticated: the runner's shared IP exhausts the anonymous
          # GitHub API pool (bit 2026-08-05, killed a tests job in 16s).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      # shared-key must be STABLE across runs — keying it on run_id gave every
      # run a fresh miss (every CI build was cold). Separate key per profile.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build

      - name: Build amore binary (unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --release -p xai-grok-pager-bin

      # MSVC hits `LNK4319: A PDB limit was hit while adding public symbols` on
      # an artifact this size; /DEBUG:NONE skips PDB emission.
      # The flags go through RUSTFLAGS, NOT `cargo rustc -- -Clink-args=…`:
      # PowerShell splits `-Clink-args=/DEBUG:NONE` at the colon and rustc then
      # sees `NONE` as a second input filename.
      - name: Build amore binary (windows)
        if: matrix.os == 'windows-latest'
        env:
          RUSTFLAGS: "-Clink-arg=/DEBUG:NONE -Clink-arg=/STACK:8388608"
        run: cargo build --release -p xai-grok-pager-bin

      - name: Smoke — amore --version stamps the build commit (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          target/release/amore --version
          target/release/amore doctor --json > doctor.json
          head -c 400 doctor.json
          echo

      - name: Smoke — amore --version stamps the build commit (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          target\release\amore.exe --version
          $doc = & target\release\amore.exe doctor --json
          if ($LASTEXITCODE -ne 0) { throw "doctor --json exited $LASTEXITCODE" }
          $doc | Select-Object -First 1

      # Keep the built binary reachable for local inspection (docs captures,
      # bisecting a report against a known commit) without a full local build.
      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: amore-ci-${{ matrix.os }}
          path: |
            target/release/amore
            target/release/amore.exe
          if-no-files-found: error
          retention-days: 7

  test:
    name: ${{ matrix.os }} — tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          # Authenticated: the runner's shared IP exhausts the anonymous
          # GitHub API pool (bit 2026-08-05, killed a tests job in 16s).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      # The debug tree for this workspace does not fit beside the runner image's
      # preinstalled toolchains; reclaim the ones no Rust build uses. Done with
      # plain rm rather than a third-party action — this is a public repo and
      # the step runs on every push.
      - name: Free runner disk (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test

      # Suites run in DEBUG. `--release` compiles out `debug_assert!`, which
      # silently breaks every `#[should_panic]` test that rides one (they fail
      # with "test did not panic as expected"), and it costs a second full
      # optimized build of the tree.
      #
      # The pager suite is gated on LINUX ONLY. It carries a large inherited
      # set of Windows failures from upstream (path-shape assertions, env and
      # concurrency classes in agent_view / shell_completion / paste — 81 in a
      # measured run), and closing those is a triage campaign, not a release
      # gate. Windows is gated on build + smoke (the `build` job) plus the
      # crate suites below, which are clean there. See UPSTREAM.md § What
      # differs and the fork's Windows test discipline.
      - name: Test pager crate (unit + integration)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p xai-grok-pager

      # --no-fail-fast: cargo otherwise stops at the first failing test
      # BINARY, which masked the update-crate suite behind an agent-crate
      # failure for multiple runs (2026-08-05). Report the whole field.
      - name: Test crate suites (linux)
        if: matrix.os == 'ubuntu-latest'
        run: >-
          cargo test --no-fail-fast
          -p xai-grok-config -p xai-grok-env -p xai-grok-hooks
          -p xai-grok-agent -p xai-grok-version -p xai-grok-update

      # Windows excludes xai-grok-agent for the same reason the pager suite is
      # Linux-gated: its failures there are inherited unix assumptions (skill
      # path shapes, repo/home resolution, plugin trust roots, and an encrypted
      # template staleness check that passes on Linux) — 5 in a measured run,
      # 567 passing. Not fork defects, and not closed by forking test logic.
      # `managed_text` is additionally skipped on Windows. Those tests only
      # became visible once the lane stopped timing out: one of them
      # (transaction_lock_blocks_second_apply_…) hung forever on Windows and was
      # consuming the entire 150-minute budget, so no run had ever reported the
      # rest. With it gated, the lane finishes in minutes and 9 further failures
      # in the same module surface — they pass individually but fail once
      # several run in one process, which is a real inherited defect and not
      # something to paper over by loosening assertions.
      #
      # Tracked, not forgotten; the exclusion is declared here rather than by
      # editing upstream tests into silence.
      # The hooks dispatcher tests spawn their fixture hooks via `sh -c`.
      # On a real Windows host with Git's sh resolvable the full suite
      # passes (24/24 verified locally 2026-08-05); on the runner the
      # fixtures fail to produce their JSON even with Git\bin prepended to
      # PATH, so fail-open hooks read as Allow and Deny-assertions fail.
      # Runner-environmental, mechanism not yet pinned down — the
      # spawn-shaped hook tests (dispatcher + two runner::command hook
      # tests) are excluded below under the same declared-exclusion
      # discipline as managed_text, tracked in the fork's house notes.
      - name: Put Git for Windows sh on PATH (hooks dispatcher fixtures)
        if: matrix.os == 'windows-latest'
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - name: Test crate suites (windows — agent crate, managed_text, spawn-shaped hook tests excluded)
        if: matrix.os == 'windows-latest'
        run: >-
          cargo test --no-fail-fast
          -p xai-grok-config -p xai-grok-env -p xai-grok-hooks
          -p xai-grok-version -p xai-grok-update
          -- --skip standalone_color_uses --skip managed_text::
          --skip dispatcher::tests::
          --skip test_hook_blocking_allow
          --skip test_parameter_expansion_default_is_not_refused
