name: release

# Tag-triggered release: amore binary ×5 targets + instrument companion assets
# (iris, lucerna, speculum), checksums, version inject, and the GitHub Release
# attach.
#
# Version: the tag drives the compiled version through GROK_VERSION
# (xai-grok-version: option_env!("GROK_VERSION") → CARGO_PKG_VERSION). The
# release gate is the tag: the Version inject step casts the tag (leading v
# stripped) into GROK_VERSION and the smoke step asserts --version contains it.
# The in-tree xai-grok-version crate version tracks upstream and is the API
# client version, independent of the product release — it need not agree with
# the tag.
#
# Instruments (iris / lucerna / speculum): matrix is linux-x64, darwin-arm64,
# windows-x64. Expansion lanes (darwin-x64, linux-arm64) are not built here.
# Each package is compiled with `bun run build:compile` in its package dir;
# contract output is dist/<name>-<os>-<arch>[.exe].

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Simulated tag (workflow_dispatch only; no Release created)"
        required: false
        default: "v0.0.0-dryrun"

permissions:
  contents: write

jobs:
  amore:
    name: amore — ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    # Release lanes always build cold (no cache is shared into a tag run) and a
    # cold build of this workspace has been measured past 60 minutes on a
    # 2-core runner. Timeouts surface as `cancelled`, not `failure`.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux lanes are pinned to the OLDEST supported LTS runner on
          # purpose: a glibc-linked binary inherits the build host's glibc as
          # its floor. ubuntu-latest (24.04, glibc 2.39) produced binaries
          # that could not load on Ubuntu 22.04 / Debian 12; 22.04 runners
          # give a 2.35 floor. Do not bump these to -latest.
          - { os: ubuntu-22.04,     artifact: amore-linux-x64,    bin: amore,     }
          - { os: ubuntu-22.04-arm, artifact: amore-linux-arm64,  bin: amore,     }
          - { os: windows-latest,   artifact: amore-windows-x64,  bin: amore.exe, }
          - { os: macos-15,         artifact: amore-darwin-arm64, bin: amore,     }
          - { os: macos-15-intel,   artifact: amore-darwin-x64,   bin: amore,     }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          # Authenticated: the runner's shared IP exhausts the anonymous
          # GitHub API pool (bit 2026-08-05, killed a tests job in 16s).
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master — installs with.toolchain (stable 1.92.0 here)
        with:
          toolchain: "1.92.0"

      - name: Version inject (strip leading v from tag)
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag }}"
          [ -n "$REF" ] || REF="${GITHUB_REF_NAME}"
          echo "GROK_VERSION=${REF#v}" >> "$GITHUB_ENV"
          echo "Version inject: ${REF#v}"

      - name: Build (unix)
        if: matrix.os != 'windows-latest'
        run: cargo build --release -p xai-grok-pager-bin

      # MSVC hits `LNK4319: A PDB limit was hit while adding public symbols` on
      # an artifact this size; /DEBUG:NONE skips PDB emission.
      # The flags go through RUSTFLAGS, NOT `cargo rustc -- -Clink-args=…`:
      # PowerShell splits `-Clink-args=/DEBUG:NONE` at the colon and rustc then
      # sees `NONE` as a second input filename.
      - name: Build (windows)
        if: matrix.os == 'windows-latest'
        env:
          RUSTFLAGS: "-Clink-arg=/DEBUG:NONE -Clink-arg=/STACK:8388608"
        run: cargo build --release -p xai-grok-pager-bin

      - name: Smoke — --version + doctor --json (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          out="$(target/release/${{ matrix.bin }} --version)"
          echo "$out"
          echo "$out" | grep -q "$GROK_VERSION" || { echo "::error::version stamp missing $GROK_VERSION"; exit 1; }
          target/release/${{ matrix.bin }} doctor --json > doctor.json
          head -c 200 doctor.json
          echo

      - name: Smoke — --version + doctor --json (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $out = & "target\release\${{ matrix.bin }}" --version | Out-String
          $out
          if ($out -notmatch [regex]::Escape($env:GROK_VERSION)) { throw "version stamp missing $env:GROK_VERSION" }
          $doc = & "target\release\${{ matrix.bin }}" doctor --json
          if ($LASTEXITCODE -ne 0) { throw "doctor --json exited $LASTEXITCODE" }
          $doc | Select-Object -First 1

      - name: Package (unix — tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -e
          stage="pkg-${{ matrix.artifact }}"
          mkdir -p "$stage"
          cp "target/release/${{ matrix.bin }}" "$stage/"
          cp LICENSE NOTICE README.md UPSTREAM.md "$stage/"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C "$stage" .
          sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          rm -rf "$stage"

      - name: Package (windows — zip)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Force -Path "pkg" | Out-Null
          Copy-Item "target\release\${{ matrix.bin }}" "pkg\"
          Copy-Item LICENSE, NOTICE, README.md, UPSTREAM.md "pkg\"
          Compress-Archive -Path "pkg\*" -DestinationPath "${{ matrix.artifact }}.zip" -Force
          $sha = (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  ${{ matrix.artifact }}.zip" | Out-File -FilePath "${{ matrix.artifact }}.zip.sha256" -Encoding ascii
          Remove-Item -Recurse -Force "pkg"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  iris:
    name: iris — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: iris-linux-x64,    suffix: linux-x64,    }
          - { os: windows-latest, name: iris-windows-x64,  suffix: windows-x64,  }
          - { os: macos-15,       name: iris-darwin-arm64, suffix: darwin-arm64, }
    defaults:
      run:
        working-directory: instruments/iris
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: iris-bun-${{ runner.os }}-${{ hashFiles('instruments/iris/bun.lock') }}
          restore-keys: iris-bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Version inject (strip leading v from tag)
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag }}"
          [ -n "$REF" ] || REF="${GITHUB_REF_NAME}"
          echo "GROK_VERSION=${REF#v}" >> "$GITHUB_ENV"
          echo "Version inject: ${REF#v}"

      - name: Build compiled multi-tool (+ dash)
        run: bun run scripts/build-compile.ts --with-dash

      - name: Smoke — multi-tool + regula surface (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          "dist/${{ matrix.name }}" --help
          out="$("dist/${{ matrix.name }}" --version)"
          echo "$out"
          echo "$out" | grep -q "$GROK_VERSION" || { echo "::error::version stamp missing $GROK_VERSION"; exit 1; }
          "dist/${{ matrix.name }}" commands --json > commands.json
          head -c 200 commands.json
          echo

      - name: Smoke — multi-tool + regula surface (windows)
        if: matrix.os == 'windows-latest'
        run: |
          & "dist/${{ matrix.name }}.exe" --help
          $out = & "dist/${{ matrix.name }}.exe" --version | Out-String
          $out
          if ($out -notmatch [regex]::Escape($env:GROK_VERSION)) { throw "version stamp missing $env:GROK_VERSION" }
          $cmds = & "dist/${{ matrix.name }}.exe" commands --json
          if ($LASTEXITCODE -ne 0) { throw "commands --json exited $LASTEXITCODE" }
          $cmds | Select-Object -First 1

      - name: Package (unix — tar.gz with multi-tool + dash)
        if: matrix.os != 'windows-latest'
        working-directory: instruments/iris
        shell: bash
        run: |
          set -e
          BIN="${{ matrix.name }}"
          DASH="iris-dash-${{ matrix.suffix }}"
          test -f "dist/$BIN"
          test -f "dist/$DASH"   # dash is required on every lane (D3-deferred CI proof)
          chmod +x "dist/$BIN" "dist/$DASH"
          mkdir -p release
          tar -C dist -czf "release/$BIN.tar.gz" "$BIN" "$DASH"
          sha256sum "release/$BIN.tar.gz" > "release/$BIN.tar.gz.sha256"
          ls -la release/

      - name: Package (windows — zip with multi-tool + dash)
        if: matrix.os == 'windows-latest'
        working-directory: instruments/iris
        run: |
          $bin = "${{ matrix.name }}.exe"
          $dash = "iris-dash-${{ matrix.suffix }}.exe"
          if (-not (Test-Path "dist/$bin")) { throw "missing dist/$bin" }
          if (-not (Test-Path "dist/$dash")) { throw "missing dist/$dash (dash build is required on all lanes)" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/$bin","dist/$dash" -DestinationPath "release/$bin.zip" -Force
          $sha = (Get-FileHash "release/$bin.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  $bin.zip" | Out-File -FilePath "release/$bin.zip.sha256" -Encoding ascii
          Get-Item release/* | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            instruments/iris/release/*.zip
            instruments/iris/release/*.zip.sha256
            instruments/iris/release/*.tar.gz
            instruments/iris/release/*.tar.gz.sha256
          if-no-files-found: error

  lucerna:
    name: lucerna — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: lucerna-linux-x64,    suffix: linux-x64,    }
          - { os: windows-latest, name: lucerna-windows-x64,  suffix: windows-x64,  }
          - { os: macos-15,       name: lucerna-darwin-arm64, suffix: darwin-arm64, }
    defaults:
      run:
        working-directory: instruments/lucerna
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: lucerna-bun-${{ runner.os }}-${{ hashFiles('instruments/lucerna/bun.lock') }}
          restore-keys: lucerna-bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Version inject (strip leading v from tag)
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag }}"
          [ -n "$REF" ] || REF="${GITHUB_REF_NAME}"
          echo "GROK_VERSION=${REF#v}" >> "$GITHUB_ENV"
          echo "Version inject: ${REF#v}"

      - name: Build compiled binary
        run: bun run build:compile

      # Capture JSON/text to a file first; never pipe live command output through
      # head (Windows/PowerShell buffering and false-empty traps).
      - name: Smoke — run and print version (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.name }}"
          test -f "$BIN" || { echo "::error::missing $BIN"; ls -la dist/ || true; exit 1; }
          chmod +x "$BIN"
          "$BIN" --version > version.txt
          cat version.txt
          test -s version.txt || { echo "::error::--version produced empty output"; exit 1; }
          grep -q "$GROK_VERSION" version.txt || { echo "::error::version stamp missing $GROK_VERSION"; exit 1; }
          head -c 200 version.txt
          echo

      - name: Smoke — run and print version (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $bin = "dist\${{ matrix.name }}.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          $out = & $bin --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($out)) { throw "--version produced empty output" }
          if ($out -notmatch [regex]::Escape($env:GROK_VERSION)) { throw "version stamp missing $env:GROK_VERSION" }
          $out | Out-File -FilePath version.txt -Encoding utf8
          Get-Content version.txt | Select-Object -First 1

      - name: Package (unix — tar.gz)
        if: matrix.os != 'windows-latest'
        working-directory: instruments/lucerna
        shell: bash
        run: |
          set -e
          BIN="${{ matrix.name }}"
          test -f "dist/$BIN"
          chmod +x "dist/$BIN"
          mkdir -p release
          tar -C dist -czf "release/$BIN.tar.gz" "$BIN"
          sha256sum "release/$BIN.tar.gz" > "release/$BIN.tar.gz.sha256"
          ls -la release/

      - name: Package (windows — zip)
        if: matrix.os == 'windows-latest'
        working-directory: instruments/lucerna
        run: |
          $bin = "${{ matrix.name }}.exe"
          if (-not (Test-Path "dist/$bin")) { throw "missing dist/$bin" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/$bin" -DestinationPath "release/$bin.zip" -Force
          $sha = (Get-FileHash "release/$bin.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  $bin.zip" | Out-File -FilePath "release/$bin.zip.sha256" -Encoding ascii
          Get-Item release/* | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            instruments/lucerna/release/*.zip
            instruments/lucerna/release/*.zip.sha256
            instruments/lucerna/release/*.tar.gz
            instruments/lucerna/release/*.tar.gz.sha256
          if-no-files-found: error

  speculum:
    name: speculum — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: speculum-linux-x64,    suffix: linux-x64,    }
          - { os: windows-latest, name: speculum-windows-x64,  suffix: windows-x64,  }
          - { os: macos-15,       name: speculum-darwin-arm64, suffix: darwin-arm64, }
    defaults:
      run:
        working-directory: instruments/speculum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3"

      - name: bun cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: speculum-bun-${{ runner.os }}-${{ hashFiles('instruments/speculum/bun.lock') }}
          restore-keys: speculum-bun-${{ runner.os }}-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Version inject (strip leading v from tag)
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag }}"
          [ -n "$REF" ] || REF="${GITHUB_REF_NAME}"
          echo "GROK_VERSION=${REF#v}" >> "$GITHUB_ENV"
          echo "Version inject: ${REF#v}"

      - name: Build compiled binary
        run: bun run build:compile

      # Capture JSON/text to a file first; never pipe live command output through
      # head (Windows/PowerShell buffering and false-empty traps).
      - name: Smoke — run and print version (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          BIN="dist/${{ matrix.name }}"
          test -f "$BIN" || { echo "::error::missing $BIN"; ls -la dist/ || true; exit 1; }
          chmod +x "$BIN"
          "$BIN" --version > version.txt
          cat version.txt
          test -s version.txt || { echo "::error::--version produced empty output"; exit 1; }
          grep -q "$GROK_VERSION" version.txt || { echo "::error::version stamp missing $GROK_VERSION"; exit 1; }
          head -c 200 version.txt
          echo

      - name: Smoke — run and print version (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $bin = "dist\${{ matrix.name }}.exe"
          if (-not (Test-Path $bin)) { throw "missing $bin" }
          $out = & $bin --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($out)) { throw "--version produced empty output" }
          if ($out -notmatch [regex]::Escape($env:GROK_VERSION)) { throw "version stamp missing $env:GROK_VERSION" }
          $out | Out-File -FilePath version.txt -Encoding utf8
          Get-Content version.txt | Select-Object -First 1

      - name: Package (unix — tar.gz)
        if: matrix.os != 'windows-latest'
        working-directory: instruments/speculum
        shell: bash
        run: |
          set -e
          BIN="${{ matrix.name }}"
          test -f "dist/$BIN"
          chmod +x "dist/$BIN"
          mkdir -p release
          tar -C dist -czf "release/$BIN.tar.gz" "$BIN"
          sha256sum "release/$BIN.tar.gz" > "release/$BIN.tar.gz.sha256"
          ls -la release/

      - name: Package (windows — zip)
        if: matrix.os == 'windows-latest'
        working-directory: instruments/speculum
        run: |
          $bin = "${{ matrix.name }}.exe"
          if (-not (Test-Path "dist/$bin")) { throw "missing dist/$bin" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/$bin" -DestinationPath "release/$bin.zip" -Force
          $sha = (Get-FileHash "release/$bin.zip" -Algorithm SHA256).Hash.ToLower()
          "$sha  $bin.zip" | Out-File -FilePath "release/$bin.zip.sha256" -Encoding ascii
          Get-Item release/* | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            instruments/speculum/release/*.zip
            instruments/speculum/release/*.zip.sha256
            instruments/speculum/release/*.tar.gz
            instruments/speculum/release/*.tar.gz.sha256
          if-no-files-found: error

  # Completeness of the release asset set is guaranteed by needs: below plus
  # if-no-files-found: error on each lane's upload — NOT by fail_on_unmatched_files
  # on softprops/action-gh-release (that flag only fails when a files: glob matches
  # nothing; assets/** still matches a partial set). Do not relax needs: for
  # latency under the belief that fail_on_unmatched_files guards completeness.
  release:
    name: GitHub Release
    needs: [amore, iris, lucerna, speculum]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*"
          merge-multiple: true
          path: assets

      # Body: docs/release-notes/<tag>.md when it exists (authored per tag),
      # else a generic stanza. The provenance table is always appended — the
      # two pins a consumer needs are the fork tip and the upstream baseline,
      # and SOURCE_REV means the UPSTREAM revision (UPSTREAM.md §3), never
      # this repo's commit.
      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          {
            echo "# Amore Build ${TAG}"
            echo
            if [ -f "$NOTES" ]; then
              cat "$NOTES"
            else
              echo "A terminal coding agent that is not a wrapper around one model."
              echo
              echo "A permanent engineered fork of xAI's open-source grok-build"
              echo "(Apache-2.0). Not an xAI product, and not affiliated with any model vendor."
            fi
            echo
            echo "## Asset map"
            echo
            echo "| Asset | Notes |"
            echo "|---|---|"
            echo "| \`amore-{platform}\` | TUI agent binary — verify with the adjacent \`.sha256\` |"
            echo "| \`iris-{platform}\` | Companion org/knowledge multi-tool (regula verbs included) |"
            echo "| \`iris-dash-{platform}\` | Optional standalone dash (TTY) — the multi-tool re-execs it when present |"
            echo "| \`lucerna-{platform}\` | Optional house steward (opt-in via \`amore init --with-lucerna\`) |"
            echo "| \`speculum-{platform}\` | Optional session mirror (opt-in via \`amore init --with-speculum\`) |"
            echo
            echo "## Provenance"
            echo
            echo "| Pin | Value |"
            echo "|---|---|"
            echo "| Fork commit (this release) | \`${GITHUB_SHA}\` |"
            echo "| Upstream baseline (\`SOURCE_REV\`) | \`$(tr -d '[:space:]' < SOURCE_REV)\` |"
            echo
            echo "Pin both — the upstream baseline this tree is rebased on, and this fork tip."
          } > notes.md
          cat notes.md

      - name: Changelog entry for this release present
        # The compiled-in user changelog must carry the release version or the
        # build will not show it in the welcome screen. Enforce on real tag
        # releases only; a workflow_dispatch dry-run (which never publishes)
        # is free to skip it.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          grep -q "## v${VER}" crates/codegen/xai-grok-shell-base/assets/amore-changelog.md \
            || { echo "::error::no '## v${VER}' entry in amore-changelog.md; add the release's user changelog in the same commit"; exit 1; }

      # fail_on_unmatched_files only fails when files: matches nothing; it does
      # not assert every expected asset is present (see needs: comment above).
      - name: Create release + attach assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Amore Build ${{ github.ref_name }}
          body_path: notes.md
          files: assets/**
          fail_on_unmatched_files: true
          generate_release_notes: false

      # softprops/action-gh-release uses GITHUB_TOKEN, which does not re-trigger
      # on: release workflows. Dispatch installers.yml explicitly so the only
      # upgrade-path smoke still runs after a published release.
      # Guard: job already requires refs/tags/; step re-asserts so a future
      # workflow_dispatch dry-run path that reaches this job still skips.
      - name: Dispatch installers.yml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run installers.yml --ref "${{ github.ref_name }}"
